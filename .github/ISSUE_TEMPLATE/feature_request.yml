name: ✨ Feature
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: input
    id: notion
    attributes:
      label: Related Notion task
      placeholder: MRK-…
  - type: textarea
    id: problem
    attributes:
      label: The need
      description: What problem does it solve for the user?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] …"
