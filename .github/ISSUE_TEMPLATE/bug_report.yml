name: 🐛 Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happens?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Click on…
        3. See the error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome 130, Windows 11 / Safari, iPhone 15…
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
